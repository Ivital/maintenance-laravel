name: Deploy TOIR2

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

concurrency:
  group: deploy-toir2-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Verify release gates
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Capture tested commit
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release candidate: ${RELEASE_SHA}"

      - name: Wait for Install workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}/actions/workflows/install.yml/runs?branch=main&event=push&head_sha=${RELEASE_SHA}&per_page=10"

          for attempt in $(seq 1 60); do
            response="$(
              curl --fail --silent --show-error                 --header "Authorization: Bearer ${GH_TOKEN}"                 --header "Accept: application/vnd.github+json"                 --header "X-GitHub-Api-Version: 2022-11-28"                 "${api}"
            )"

            run_count="$(jq -r '.total_count' <<< "${response}")"

            if [ "${run_count}" = "0" ]; then
              echo "Install workflow has not started for ${RELEASE_SHA} yet (${attempt}/60)."
              sleep 10
              continue
            fi

            status="$(jq -r '.workflow_runs[0].status' <<< "${response}")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<< "${response}")"
            run_url="$(jq -r '.workflow_runs[0].html_url' <<< "${response}")"

            echo "Install: status=${status}, conclusion=${conclusion}"

            if [ "${status}" != "completed" ]; then
              sleep 10
              continue
            fi

            if [ "${conclusion}" != "success" ]; then
              echo "::error::Install workflow did not pass for ${RELEASE_SHA}: ${conclusion}"
              echo "${run_url}"
              exit 1
            fi

            echo "Install gate passed: ${run_url}"
            exit 0
          done

          echo "::error::Timed out waiting for Install workflow for ${RELEASE_SHA}"
          exit 1

      - name: Ensure candidate is still main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          main_sha="$(
            curl --fail --silent --show-error               --header "Authorization: Bearer ${GH_TOKEN}"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${REPOSITORY}/commits/main" |
            jq -r '.sha'
          )"

          if [ "${main_sha}" != "${RELEASE_SHA}" ]; then
            echo "::error::Refusing stale deployment. main=${main_sha}, tested=${RELEASE_SHA}"
            exit 1
          fi

          echo "main still points to tested commit ${RELEASE_SHA}"

  deploy:
    name: Deploy to ergodata-lnx
    needs: gate
    runs-on: [self-hosted, Linux, X64, toir2]
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if [ "${actual_sha}" != "${RELEASE_SHA}" ]; then
            echo "::error::Checked out ${actual_sha}, expected ${RELEASE_SHA}"
            exit 1
          fi

      - name: Build deployment bundle
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          DEPLOY_INPUT: /home/gh-runner/deploy-input
        run: |
          set -euo pipefail

          mkdir -p "${DEPLOY_INPUT}"

          tmp_bundle="${DEPLOY_INPUT}/toir2-release.bundle.tmp"
          final_bundle="${DEPLOY_INPUT}/toir2-release.bundle"

          rm -f "${tmp_bundle}"
          git bundle create "${tmp_bundle}" HEAD
          git bundle verify "${tmp_bundle}"

          mv -f "${tmp_bundle}" "${final_bundle}"
          printf '%s\n' "${RELEASE_SHA}" > "${DEPLOY_INPUT}/toir2-release.sha"

      - name: Deploy TOIR2
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/deploy-toir2 "${RELEASE_SHA}"
